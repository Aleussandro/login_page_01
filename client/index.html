<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/login.js" defer></script>
    
    <title>Login</title>

</head>

<body>
    <div class="main-login">
        <div class="left-login">
            <h1>BEM-VINDO<br>Faça seu Login</h1>
            <img src="assets/equipe.svg" class="left-login-image" alt="Team animation">
        </div>  
        <div class="right-login">
            <div class="card-login">
                <h1>LOGIN</h1>

                <div class="textfield">
                    <label for="usuario">Usuário</label>
                    <input 
                        type="text" 
                        id="usernameInput" 
                        name="usuario" 
                        placeholder="Usuário">
                </div>

                <div class="textfield">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="senha"    
                        placeholder="Senha">
                </div>
                
                <p id="statusMessage" class="status-message"></p>
                <button id="loginBtn" class="btn-login">Login</button>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="register.html" style="color: #f2f2f2; text-decoration: none; font-size: 14px;">Criar conta</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
